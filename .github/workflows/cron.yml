name: Cron reauthorize

on:
  schedule:
    - cron: "4-59/10 * * * *"
  workflow_dispatch:

jobs:
  reauthorize:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reauthorize endpoint
        run: |
          curl -sf \
            --retry 3 \
            --retry-delay 20 \
            --max-time 120 \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/reauthorize"
