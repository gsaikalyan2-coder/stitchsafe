services:
  - type: web
    name: stitchsafe
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20.19.0"
      - key: AUTH_URL
        sync: false
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: AUTH_SECRET
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: stitchsafe-photos
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_API_BASE
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_WEB_BASE
        value: https://www.sandbox.paypal.com
      - key: NEXT_PUBLIC_PAYPAL_CLIENT_ID
        sync: false
      - key: AUTH_RESEND_KEY
        sync: false
      - key: EMAIL_FROM
        value: onboarding@resend.dev
      - key: SEED_TAILOR_EMAIL
        sync: false
      - key: SEED_CUSTOMER_EMAIL
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_API_KEY
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL_VISION
        value: gemini-3.8-flash
      - key: GEMINI_MODEL_VISION_FALLBACK
        value: gemini-3.6-flash
      - key: GEMINI_MODEL_FAST
        value: gemini-3.5-flash-lite
